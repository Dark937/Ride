<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — Ride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles/auth.css">
  <script>
    (function(){
      var t=localStorage.getItem('ride_theme')||'dark';
      var m=localStorage.getItem('ride_reduce_motion')==='true';
      document.documentElement.setAttribute('data-theme',t);
      if(m) document.documentElement.classList.add('reduce-motion');
    })();
  </script>
</head>
<body>

<div class="auth-page">
  <div class="auth-left">

    <a href="index.html" class="auth-back" aria-label="Back to home">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Home
    </a>

    <a href="index.html" class="auth-logo">
      <img src="assets/logo.png" alt="Ride">
    </a>

    <div class="auth-form-wrap">

      <div id="rpStep1">
        <div class="auth-heading">
          <h1>Set new password</h1>
          <p>Choose a strong password for your account.</p>
        </div>

        <div class="auth-fields" style="margin-top:24px;">

          <div class="auth-field">
            <label for="rpNew">New password</label>
            <div class="auth-field-row">
              <input type="password" id="rpNew" placeholder="Min 8 characters" autocomplete="new-password">
              <button type="button" class="auth-toggle" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="auth-field-error" role="alert"></span>
            <div class="strength-meter" style="margin-top:6px;">
              <div class="strength-bar"><span></span><span></span><span></span><span></span></div>
              <span class="strength-label"></span>
            </div>
          </div>

          <div class="auth-field">
            <label for="rpConfirm">Confirm password</label>
            <div class="auth-field-row">
              <input type="password" id="rpConfirm" placeholder="Repeat password" autocomplete="new-password">
              <button type="button" class="auth-toggle" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="auth-field-error" role="alert"></span>
          </div>

        </div>

        <div class="auth-error-banner" id="rpError" role="alert" style="display:none;">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <p id="rpErrorMsg"></p>
        </div>

        <button type="button" id="rpSubmit" class="auth-submit" style="margin-top:20px;">
          <span class="btn-text">Update password</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>

      <div id="rpStep2" style="display:none; text-align:center;">
        <div class="fm-success-icon" style="margin:0 auto 20px;">
          <svg viewBox="0 0 52 52" fill="none">
            <circle cx="26" cy="26" r="24" stroke="rgba(34,197,94,.3)" stroke-width="1.5"/>
            <path d="M16 26l8 8 13-13" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 style="margin-bottom:8px;">Password updated!</h2>
        <p style="color:var(--text-muted);margin-bottom:24px;">You can now sign in with your new password.</p>
        <a href="login.html" class="auth-submit" style="text-decoration:none;display:block;text-align:center;">
          <span class="btn-text">Sign in</span>
        </a>
      </div>

      <div id="rpInvalid" style="display:none; text-align:center;">
        <p style="color:var(--text-muted);margin-bottom:20px;">This reset link is invalid or has expired.</p>
        <a href="login.html" class="auth-submit" style="text-decoration:none;display:block;text-align:center;">
          <span class="btn-text">Back to sign in</span>
        </a>
      </div>

    </div>
  </div>

  <div class="auth-right" aria-hidden="true">
    <div class="auth-right-inner"></div>
  </div>
</div>

<script src="scripts/shared.js"></script>
<script>
"use strict";
document.addEventListener("DOMContentLoaded", () => {
  Theme.apply();

  const token = new URLSearchParams(window.location.search).get("token");
  if (!token) {
    document.getElementById("rpStep1").style.display = "none";
    document.getElementById("rpInvalid").style.display = "";
    return;
  }

  // Password visibility toggles
  document.querySelectorAll(".auth-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const inp = btn.closest(".auth-field-row").querySelector("input");
      inp.type = inp.type === "password" ? "text" : "password";
    });
  });

  // Strength meter
  const rpNew = document.getElementById("rpNew");
  rpNew.addEventListener("input", () => {
    const pw  = rpNew.value;
    let score = 0;
    if (pw.length >= 8)           score++;
    if (/[A-Z]/.test(pw))         score++;
    if (/[0-9]/.test(pw))         score++;
    if (/[^A-Za-z0-9]/.test(pw))  score++;
    const cls    = ["","weak","fair","good","strong"];
    const labels = ["","Weak","Fair","Good","Strong"];
    document.querySelectorAll(".strength-bar span").forEach((s, i) => {
      s.className = i < score ? cls[score] : "";
    });
    const lbl = document.querySelector(".strength-label");
    if (lbl) lbl.textContent = pw.length ? labels[score] : "";
  });

  document.getElementById("rpSubmit").addEventListener("click", async () => {
    const newPw  = rpNew.value;
    const cfmPw  = document.getElementById("rpConfirm").value;
    const errEl  = document.getElementById("rpError");
    const errMsg = document.getElementById("rpErrorMsg");
    errEl.style.display = "none";

    if (newPw.length < 8) { errMsg.textContent = "Password must be at least 8 characters."; errEl.style.display = "flex"; return; }
    if (newPw !== cfmPw)  { errMsg.textContent = "Passwords do not match."; errEl.style.display = "flex"; return; }

    const btn = document.getElementById("rpSubmit");
    btn.classList.add("is-loading"); btn.disabled = true;

    try {
      const resp = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: newPw }),
      });
      const data = await resp.json();
      if (resp.ok) {
        document.getElementById("rpStep1").style.display = "none";
        document.getElementById("rpStep2").style.display = "";
      } else {
        errMsg.textContent = data.error || "Failed to reset password.";
        errEl.style.display = "flex";
        btn.classList.remove("is-loading"); btn.disabled = false;
      }
    } catch (_) {
      errMsg.textContent = "Connection error. Please try again.";
      errEl.style.display = "flex";
      btn.classList.remove("is-loading"); btn.disabled = false;
    }
  });
});
</script>

</body>
</html>
